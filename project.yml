name: Sherik
options:
  bundleIdPrefix: uz.sherik
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.32.3
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0
targets:
  Sherik:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: SwiftHuggingFace
        product: HuggingFace
      - package: SwiftTransformers
        product: Tokenizers
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Sherik
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "Sherik sizning ovozingizni tinglashi uchun mikrofon kerak."
        NSSpeechRecognitionUsageDescription: "Sherik gapingizni matnga aylantirishi uchun nutqni aniqlash kerak."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.sherik.assistant
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: NO
